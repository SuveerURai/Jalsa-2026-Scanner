<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>JALSA 2026 Entry Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
      font-size: 42px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
      font-size: 24px;
    }

    #reader {
      width: 100%;
      background: black;
      border-radius: 16px;
      overflow: hidden;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 22px;
      border-radius: 16px;
      background: #1f2937;
      text-align: center;
    }

    .result.valid {
      border: 2px solid #22c55e;
    }

    .result.invalid {
      border: 2px solid #ef4444;
    }

    .result.warning {
      border: 2px solid #f59e0b;
    }

    .result h2 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 30px;
    }

    .ticket-info {
      text-align: left;
      line-height: 1.8;
      margin: 15px 0;
      font-size: 18px;
    }

    .admit {
      background: #22c55e;
      color: white;
    }

    .scan-again {
      background: #374151;
      color: white;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 16px;
      margin-top: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
    }

    .status-text {
      font-size: 15px;
      color: #d1d5db;
    }

    .footer {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 25px;
    }

    small {
      color: #d1d5db;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>JALSA 2026</h1>

  <div class="subtitle">
    Entry Scanner
  </div>


  <div id="reader"></div>


  <div id="result" class="result">

    <h2 id="resultTitle"></h2>

    <div id="ticketInfo" class="ticket-info"></div>


    <button
      id="admitButton"
      class="admit"
      style="display:none;"
      onclick="admitEntry()">

      ADMIT ENTRY

    </button>


    <button
      id="scanAgainButton"
      class="scan-again"
      onclick="scanAgain()">

      SCAN ANOTHER TICKET

    </button>

  </div>


  <div class="footer">
    JALSA 2026 • Authorized Entry Scanner
  </div>

</div>


<script>


/* =========================================================
   GOOGLE APPS SCRIPT API
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzQNHxOdXTX9RkNqbZE1Pzz8Q6_jdJ7IUT6T13n10UezSJWiwmM1Rky9mbo248pZXGX/exec";


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let scanner = null;

let scanning = false;

let currentToken = null;

let requestInProgress = false;


/* =========================================================
   START CAMERA
========================================================= */

function startScanner() {

  scanning = true;

  scanner = new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },


    function(decodedText) {

      if (!scanning) {
        return;
      }

      if (requestInProgress) {
        return;
      }


      scanning = false;

      currentToken = decodedText.trim();


      stopScanner();


      checkTicket(currentToken);

    },


    function(errorMessage) {

      // Normal QR scanning errors are ignored.

    }

  )


  .catch(function(error) {

    showResult(

      "CAMERA ERROR",

      "Could not start the camera.<br><br>" +

      escapeHtml(
        error.toString()
      ),

      "invalid"

    );

  });

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopScanner() {

  if (!scanner) {
    return;
  }


  scanner.stop()

    .then(function() {

      console.log(
        "Scanner stopped."
      );

    })

    .catch(function(error) {

      console.log(
        "Scanner stop error:",
        error
      );

    });

}


/* =========================================================
   CHECK TICKET
========================================================= */

function checkTicket(token) {

  requestInProgress = true;


  showResult(

    "CHECKING TICKET...",

    "Please wait.",

    "warning"

  );


  const callbackName =
    "jalsaCheck_" + Date.now();


  let finished = false;


  /*
     Prevent the same request from
     being completed twice.
  */

  function finishRequest() {

    if (finished) {
      return;
    }


    finished = true;


    delete window[callbackName];


    requestInProgress = false;

  }


  /*
     JSONP callback
  */

  window[callbackName] = function(data) {

    console.log(
      "CHECK RESPONSE:",
      data
    );


    finishRequest();


    if (!data) {

      showResult(

        "ERROR",

        "No response received from the server.",

        "invalid"

      );

      return;

    }


    /*
       VALID TICKET
    */

    if (data.status === "VALID") {

      showResult(

        "VALID TICKET",

        ticketDetails(data) +

        "<br><br>" +

        "<span class='status-text'>" +

        "Payment verified. Ready for admission." +

        "</span>",

        "valid"

      );


      document
        .getElementById("admitButton")
        .style.display = "block";


      return;

    }


    /*
       ALREADY ENTERED
    */

    if (data.status === "ALREADY_ENTERED") {

      showResult(

        "ALREADY ENTERED",

        ticketDetails(data) +

        "<br><br>" +

        "<span class='status-text'>" +

        "This ticket has already been used." +

        "</span>",

        "invalid"

      );


      return;

    }


    /*
       PAYMENT NOT VERIFIED
    */

    if (data.status === "PAYMENT_NOT_VERIFIED") {

      showResult(

        "PAYMENT NOT VERIFIED",

        ticketDetails(data) +

        "<br><br>" +

        "<span class='status-text'>" +

        escapeHtml(

          data.message ||

          "Payment has not been verified."

        ) +

        "</span>",

        "warning"

      );


      return;

    }


    /*
       INVALID QR
    */

    showResult(

      "INVALID QR",

      escapeHtml(

        data.message ||

        "This QR code is not recognized."

      ),

      "invalid"

    );

  };


  /*
     Create JSONP request
  */

  const script =
    document.createElement("script");


  script.src =

    API_URL +

    "?action=check" +

    "&token=" +

    encodeURIComponent(token) +

    "&prefix=" +

    encodeURIComponent(callbackName) +

    "&t=" +

    Date.now();


  /*
     Network/load error
  */

  script.onerror = function() {

    finishRequest();


    showResult(

      "CONNECTION ERROR",

      "Could not connect to the JALSA server.<br><br>" +

      "<small>" +

      "Please check your internet connection and try again." +

      "</small>",

      "invalid"

    );

  };


  /*
     Safety timeout.
     If the server does not respond
     within 10 seconds, stop waiting.
  */

  setTimeout(function() {

    if (finished) {
      return;
    }


    finishRequest();


    showResult(

      "CONNECTION ERROR",

      "The JALSA server took too long to respond.<br><br>" +

      "<small>" +

      "Please check your internet connection and try again." +

      "</small>",

      "invalid"

    );

  }, 10000);


  /*
     IMPORTANT:
     The script is appended HERE,
     outside script.onerror.
  */

  document.body.appendChild(script);

}


/* =========================================================
   ADMIT ENTRY
========================================================= */

function admitEntry() {

  if (!currentToken) {
    return;
  }


  if (requestInProgress) {
    return;
  }


  requestInProgress = true;


  const admitButton =
    document.getElementById("admitButton");


  admitButton.disabled = true;

  admitButton.innerText =
    "RECORDING ENTRY...";


  const callbackName =
    "jalsaAdmit_" + Date.now();


  let finished = false;


  /*
     Prevent duplicate callback handling.
  */

  function finishAdmissionRequest() {

    if (finished) {
      return;
    }


    finished = true;


    delete window[callbackName];


    requestInProgress = false;

  }


  /*
     JSONP callback
  */

  window[callbackName] = function(data) {

    console.log(
      "ADMIT RESPONSE:",
      data
    );


    finishAdmissionRequest();


    /*
       ENTRY SUCCESSFULLY RECORDED
    */

    if (
      data &&
      data.status === "ENTERED"
    ) {

      showResult(

        "ENTRY RECORDED ✓",

        ticketDetails(data) +

        "<br><br>" +

        "<span class='status-text'>" +

        "Entry successfully recorded." +

        "</span>",

        "valid"

      );


      admitButton.style.display =
        "none";


      return;

    }


    /*
       ALREADY ENTERED
    */

    if (
      data &&
      data.status === "ALREADY_ENTERED"
    ) {

      showResult(

        "ALREADY ENTERED",

        ticketDetails(data) +

        "<br><br>" +

        "<span class='status-text'>" +

        "This ticket has already been used." +

        "</span>",

        "invalid"

      );


      admitButton.style.display =
        "none";


      return;

    }


    /*
       PAYMENT NOT VERIFIED
    */

    if (
      data &&
      data.status === "PAYMENT_NOT_VERIFIED"
    ) {

      showResult(

        "PAYMENT NOT VERIFIED",

        ticketDetails(data) +

        "<br><br>" +

        "<span class='status-text'>" +

        "Payment has not been verified." +

        "</span>",

        "warning"

      );


      admitButton.style.display =
        "none";


      return;

    }


    /*
       OTHER ERROR
    */

    showResult(

      "ENTRY NOT RECORDED",

      escapeHtml(

        data && data.message

          ? data.message

          : "The ticket could not be admitted."

      ),

      "invalid"

    );


    admitButton.disabled = false;

    admitButton.innerText =
      "ADMIT ENTRY";

  };


  /*
     Create JSONP admission request
  */

  const script =
    document.createElement("script");


  script.src =

    API_URL +

    "?action=admit" +

    "&token=" +

    encodeURIComponent(currentToken) +

    "&prefix=" +

    encodeURIComponent(callbackName) +

    "&t=" +

    Date.now();


  /*
     Network error
  */

  script.onerror = function(error) {

    console.error(
      "Admission API failed:",
      error
    );


    finishAdmissionRequest();


    admitButton.disabled = false;

    admitButton.innerText =
      "ADMIT ENTRY";


    showResult(

      "CONNECTION ERROR",

      "The JALSA server could not be reached.<br><br>" +

      "<small>" +

      "Please check your internet connection and try again." +

      "</small>",

      "invalid"

    );

  };


  /*
     Safety timeout
  */

  setTimeout(function() {

    if (finished) {
      return;
    }


    finishAdmissionRequest();


    admitButton.disabled = false;

    admitButton.innerText =
      "ADMIT ENTRY";


    showResult(

      "CONNECTION ERROR",

      "The JALSA server took too long to respond.<br><br>" +

      "<small>" +

      "Please check your internet connection and try again." +

      "</small>",

      "invalid"

    );

  }, 10000);


  /*
     Start request
  */

  document.body.appendChild(script);

}


/* =========================================================
   DISPLAY TICKET DETAILS
========================================================= */

function ticketDetails(data) {

  let html = "";


  if (data.name) {

    html +=

      "<strong>Name:</strong> " +

      escapeHtml(
        String(data.name)
      ) +

      "<br>";

  }


  if (data.ticketId) {

    html +=

      "<strong>Ticket ID:</strong> " +

      escapeHtml(
        String(data.ticketId)
      );

  }


  if (data.entryTime) {

    html +=

      "<br><strong>Entry Time:</strong> " +

      escapeHtml(

        formatDate(
          data.entryTime
        )

      );

  }


  return html;

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(value) {

  try {

    const date =
      new Date(value);


    if (
      isNaN(
        date.getTime()
      )
    ) {

      return String(value);

    }


    return date.toLocaleString(

      "en-IN",

      {

        day: "2-digit",

        month: "short",

        year: "numeric",

        hour: "2-digit",

        minute: "2-digit",

        second: "2-digit"

      }

    );

  }

  catch (error) {

    return String(value);

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   SHOW RESULT
========================================================= */

function showResult(
  title,
  content,
  type
) {

  const result =
    document.getElementById(
      "result"
    );


  const resultTitle =
    document.getElementById(
      "resultTitle"
    );


  const ticketInfo =
    document.getElementById(
      "ticketInfo"
    );


  const admitButton =
    document.getElementById(
      "admitButton"
    );


  resultTitle.innerHTML =
    escapeHtml(title);


  ticketInfo.innerHTML =
    content;


  result.className =
    "result " + type;


  result.style.display =
    "block";


  /*
     Only VALID TICKET should
     show the admission button.
  */

  if (title !== "VALID TICKET") {

    admitButton.style.display =
      "none";

  }

}


/* =========================================================
   SCAN AGAIN
========================================================= */

function scanAgain() {

  const result =
    document.getElementById(
      "result"
    );


  const admitButton =
    document.getElementById(
      "admitButton"
    );


  result.style.display =
    "none";


  admitButton.style.display =
    "none";


  admitButton.disabled =
    false;


  admitButton.innerText =
    "ADMIT ENTRY";


  currentToken =
    null;


  requestInProgress =
    false;


  scanning =
    false;


  /*
     Clear previous scanner
  */

  if (scanner) {

    scanner.clear()

      .catch(function() {});

    scanner =
      null;

  }


  /*
     Restart camera
  */

  startScanner();

}


/* =========================================================
   START SCANNER WHEN PAGE LOADS
========================================================= */

window.addEventListener(

  "load",

  function() {

    startScanner();

  }

);

</script>

</body>

</html>
